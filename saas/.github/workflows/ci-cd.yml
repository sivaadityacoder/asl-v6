name: ASL V6 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Backend Tests
  # ──────────────────────────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./v6/saas/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .[dev]

      - name: Run linting
        run: |
          ruff check .
          black --check .

      - name: Run tests
        run: pytest --cov=app --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend

  # ──────────────────────────────────────────────────────────────────────────────
  # FP Rate Regression Gate
  # Fail CI if the false positive rate exceeds 15% on any benchmark run
  # ──────────────────────────────────────────────────────────────────────────────
  fp-regression-gate:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: ./v6/saas/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run FP rate benchmark check
        run: |
          python3 - << 'EOF'
          import sys
          sys.path.insert(0, '.')
          from app.scan.benchmark_dataset import get_benchmark_summary

          summary = get_benchmark_summary()
          asl = summary["asl_v6"]
          fp_rate = asl["fp_rate"]
          MAX_FP_RATE = 15.0  # CI gate threshold

          print(f"ASL V6 False Positive Rate: {fp_rate}%")
          print(f"Maximum allowed: {MAX_FP_RATE}%")
          print(f"True Positive Rate: {asl['tp_rate']}%")
          print(f"F1 Score: {asl['f1']}%")

          if fp_rate > MAX_FP_RATE:
              print(f"FAIL: FP rate {fp_rate}% exceeds threshold {MAX_FP_RATE}%")
              sys.exit(1)
          else:
              print(f"PASS: FP rate {fp_rate}% is within acceptable threshold")
              sys.exit(0)
          EOF

  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend Tests
  # ──────────────────────────────────────────────────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./v6/saas/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: v6/saas/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build (verify)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Supabase Migrations
  # ──────────────────────────────────────────────────────────────────────────────
  supabase-migrate:
    runs-on: ubuntu-latest
    needs: [backend-test, fp-regression-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase db push
        working-directory: ./v6/saas

  # ──────────────────────────────────────────────────────────────────────────────
  # Build & Push Backend Image
  # ──────────────────────────────────────────────────────────────────────────────
  backend-build:
    needs: [backend-test, fp-regression-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./v6/saas
          file: ./v6/saas/infrastructure/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy Backend to Azure App Service
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    needs: [backend-build, supabase-migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-aslv6-prod-3600
          package: ./v6/saas/backend

      - name: Set Azure App Settings
        run: |
          az webapp config appsettings set \
            --name app-aslv6-prod-3600 \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              SUPABASE_JWT_SECRET="${{ secrets.SUPABASE_JWT_SECRET }}" \
              GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}" \
              GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}" \
              GITHUB_WEBHOOK_SECRET="${{ secrets.GITHUB_WEBHOOK_SECRET }}" \
              NVIDIA_API_KEY="${{ secrets.NVIDIA_API_KEY }}" \
              SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              ENVIRONMENT="production" \
              FRONTEND_URL="https://app.adityasecuritylabs.tech"

      - name: Verify Azure health check
        run: |
          sleep 20
          curl -f https://app-aslv6-prod-3600.azurewebsites.net/health || echo "Health check pending..."

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy Frontend to Vercel
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    needs: frontend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel (production)
        run: |
          vercel --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.VERCEL_ORG_ID }}" \
            --yes
        working-directory: ./v6/saas/frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: https://app-aslv6-prod-3600.azurewebsites.net
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Security Scanning
  # ──────────────────────────────────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/ci
            p/secrets
            p/security-audit
          generate-sarif: true

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: semgrep.sarif