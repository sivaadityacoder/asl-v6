# ASL V6 Backend - Fly.io Configuration
app = "asl-v6-backend"
primary_region = "sin"   # Singapore — closest to South Asia

[build]
  dockerfile = "infrastructure/docker/Dockerfile.backend"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  API_PREFIX = "/api/v1"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 3
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[mounts]
  source = "asl_v6_data"
  destination = "/app/data"

[processes]
  app = "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2 --timeout 120"
  worker = "celery -A app.services.scan_worker worker --loglevel=info --concurrency=4"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[deploy]
  strategy = "rolling"
  wait_timeout = "5m"