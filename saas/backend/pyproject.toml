[project]
name = "asl-v6-backend"
version = "1.0.0"
description = "ASL V6 AI Security Platform - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "supabase>=2.3.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "githubkit>=0.16.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "tenacity>=8.2.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.19.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=61.0",
    "markdown>=3.6.0",
    "pygithub>=2.1.0",
    "semgrep>=1.60.0",
    "bandit>=1.7.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "networkx>=3.2.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "gunicorn>=22.0.0",
    "mcp>=0.1.0",
    "stripe>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "ARG"]
ignore = ["E501", "SIM103", "ARG001", "ARG002"]
per-file-ignores = { "tests/*" = ["S101", "S106"] }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]