name: ASL V6.1 Community Security Gate
# Free local CI/CD workflow; no subscription key is required.
# Author: Siva Aditya Panuganti (Security Researcher | 6+ AI CVEs)

on:
  pull_request:
    branches: [ main, master, staging ]
  push:
    branches: [ main, master ]

jobs:
  ai-security-audit:
    name: ASL V6 Vulnerability & Red-Team Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # For GitHub Advanced Security SARIF reporting
      pull-requests: write # For commenting automated fixes on PRs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ASL V6.1 Scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Execute ASL V6 Verification Gauntlet Scan
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}   # For Layer 10 AI Patch Synthesis
        run: |
          echo "🔒 Running ASL V6.1 AI Security Assessment..."
          asl-v6 ./ --output-root . --fail-on high

      - name: Upload ASL V6 Executive Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asl-v6-security-report
          path: reports/ASL_V6_REPORT_*.md
          retention-days: 30
