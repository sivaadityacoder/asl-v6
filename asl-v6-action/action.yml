name: "ASL V6 Auto-Auditor"
description: "Automatically scans Pull Requests using ASL V6 and comments inline on verified issues."
branding:
  icon: "shield"
  color: "blue"

inputs:
  github_token:
    description: "GitHub token for reading PR files and posting review comments"
    required: true
  fail_on_high_severity:
    description: "Fail the CI if verified high-severity issues are found"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ASL V6 Auditor Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "rich>=13" "requests>=2.31"

    - name: Run ASL V6 PR Auditor
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        FAIL_ON_HIGH_SEVERITY: ${{ inputs.fail_on_high_severity }}
      run: |
        echo "🔒 Running ASL V6 PR Auditor..."
        python ${{ github.action_path }}/pr_auditor.py
